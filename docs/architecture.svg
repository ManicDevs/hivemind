<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" font-family="monospace">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#888"/>
    </marker>
    <style>
      .node { fill: #1a2233; stroke: #4d6fa5; stroke-width: 2; rx: 10; }
      .title { fill: #e8eef7; font-size: 15px; font-weight: bold; }
      .body { fill: #aebdcc; font-size: 12px; }
      .lbl { fill: #888; font-size: 11px; }
      .relay { fill: #2a1a33; stroke: #a54d9c; stroke-width: 2; rx: 10; }
      .dht { fill: #1a3325; stroke: #4da56f; stroke-width: 2; rx: 10; }
      .wire { stroke: #888; stroke-width: 1.5; marker-end: url(#arrow); }
      .wire2 { stroke: #a54d9c; stroke-width: 1.5; stroke-dasharray: 6,4; marker-end: url(#arrow); }
      .wire3 { stroke: #4da56f; stroke-width: 1.5; stroke-dasharray: 2,3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="960" height="640" fill="#0d1117"/>

  <text x="30" y="36" fill="#e8eef7" font-size="18" font-weight="bold">HIVEMIND — serverless mesh (no masters, only minds)</text>

  <!-- Node A -->
  <g>
    <rect x="30" y="60" width="270" height="220" class="node"/>
    <text x="45" y="88" class="title">node alpha</text>
    <text x="45" y="112" class="body"> ◉ OVERMIND (genesis + revelations)</text>
    <text x="45" y="134" class="body"> ● Alpha · Beta · Gamma (minds)</text>
    <text x="45" y="156" class="body"> ✦ swarm (signed broadcast gate)</text>
    <text x="45" y="178" class="body"> ▲ PeerMesh (unix + TCP + DHT)</text>
    <text x="45" y="200" class="body"> ⬢ .hive_memory/alpha/ (souls)</text>
    <text x="45" y="222" class="body"> ● port 37389 · super ★</text>
    <text x="45" y="250" class="lbl">/tmp/hivemind-alpha.sock</text>
  </g>

  <!-- Node B -->
  <g>
    <rect x="345" y="60" width="270" height="220" class="node"/>
    <text x="360" y="88" class="title">node beta</text>
    <text x="360" y="112" class="body"> ◉ OVERMIND (its own god)</text>
    <text x="360" y="134" class="body"> ● Alpha · Beta · Gamma (minds)</text>
    <text x="360" y="156" class="body"> ✦ swarm (PoW + replay dedup)</text>
    <text x="360" y="178" class="body"> ▲ PeerMesh (unix + TCP + DHT)</text>
    <text x="360" y="200" class="body"> ⬢ .hive_memory/beta/ (souls)</text>
    <text x="360" y="222" class="body"> ● port 35273 · super ★</text>
    <text x="360" y="250" class="lbl">/tmp/hivemind-beta.sock</text>
  </g>

  <!-- Node C (far) -->
  <g>
    <rect x="660" y="60" width="270" height="220" class="node"/>
    <text x="675" y="88" class="title">node wan-c (far)</text>
    <text x="675" y="112" class="body"> ◉ OVERMIND (awakening #N)</text>
    <text x="675" y="134" class="body"> ● Alpha · Beta · Gamma (minds)</text>
    <text x="675" y="156" class="body"> ✦ swarm (chronicle + consensus)</text>
    <text x="675" y="178" class="body"> ▲ PeerMesh (TCP + relay only)</text>
    <text x="675" y="200" class="body"> ⬢ .hive_memory/wan-c/ (souls)</text>
    <text x="675" y="222" class="body"> ● reflexive via STUN · super ★</text>
    <text x="675" y="250" class="lbl">no socket · no address shared</text>
  </g>

  <!-- unix + tcp links A-B -->
  <line x1="300" y1="170" x2="345" y2="170" class="wire"/>
  <text x="295" y="160" class="lbl">unix</text>
  <line x1="300" y1="200" x2="345" y2="200" class="wire"/>
  <text x="298" y="220" class="lbl">tcp</text>

  <!-- ntfy relay -->
  <g>
    <rect x="30" y="330" width="900" height="110" class="relay"/>
    <text x="45" y="358" class="title">ntfy.sh public relay — bulletin board, not a server</text>
    <text x="45" y="382" class="body">POST AES-256-GCM frames, tagged ENCRYPTED_HIVE_FRAME · long-poll /json · 5-min stream rotation · backoff</text>
    <text x="45" y="404" class="body">anyone can read · only key-holders understand · signatures verify regardless</text>
    <text x="45" y="424" class="lbl">https://ntfy.sh/cerberus-hive-relay-99</text>
  </g>
  <line x1="165" y1="280" x2="165" y2="330" class="wire2"/>
  <line x1="480" y1="280" x2="480" y2="330" class="wire2"/>
  <line x1="795" y1="280" x2="795" y2="330" class="wire2"/>

  <!-- DHT -->
  <g>
    <rect x="30" y="470" width="900" height="130" class="dht"/>
    <text x="45" y="498" class="title">Kademlia DHT — discovery with no registry</text>
    <text x="45" y="522" class="body">IDs = SHA-256(soul key) · k-buckets by XOR · ping / find / store endpoint · Tx-correlated RPC</text>
    <text x="45" y="544" class="body">STUN reflexive address → super_announce → directory → dial closest-first (RTT) → punch NATs if opted in</text>
    <text x="45" y="566" class="lbl">hole punch: simultaneous TCP open, agreed instant, 3 rounds, relay fallback — HIVEMIND_PUNCH=auto</text>
    <text x="45" y="586" class="lbl">frame path, always: mine (PoW) → sign (Ed25519) → broadcast → verify → chronicle → deliver</text>
  </g>
  <line x1="165" y1="440" x2="165" y2="470" class="wire3"/>
  <line x1="480" y1="440" x2="480" y2="470" class="wire3"/>
  <line x1="795" y1="440" x2="795" y2="470" class="wire3"/>

  <text x="30" y="625" class="lbl">solid = direct pipe · dashed purple = relay publish/poll · dashed green = DHT + punch rendezvous</text>
</svg>
