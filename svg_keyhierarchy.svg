<?xml version="1.0" encoding="UTF-8"?>
<!-- HIVEMIND Key Hierarchy Diagram — v2 derivation chain -->
<svg width="700" height="400" viewBox="0 0 700 400"
     xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<style>
  .root { fill: #e8e8e8; stroke: #666; stroke-width: 2; }
  .day { fill: #d4e6f1; stroke: #2c5aa0; stroke-width: 2; }
  .minute { fill: #f0e6d2; stroke: #b45f06; stroke-width: 2; }
  .label { font-family: sans-serif; font-size: 11; fill: #333; text-anchor: middle; }
  .arrow { stroke: #555; stroke-width: 2; marker-end: url(#arrowhead); }
  .arrowhead { d="M0,0 L4,-4 L0,0 L-4,-4 Z" fill="#555"; }
</style>
 defs>
  <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="0" refY="2.5" orient="auto">
    <polygon points="0,0 4,-4 0,0 -4,-4" fill="#555"/>
  </marker>
</defs>
<!-- Root key at top -->
<g transform="translate(350, 40)">
  <rect x="-70" y="-20" width="140" height="40" class="root"/><text x="0" y="5" class="label">root key<br/>(HIVEMIND_CIPHER_KEY, 32 bytes)</text>
</g>
<!-- Day chain descending -->
<g transform="translate(350, 100)">
  <!-- Day 0 -->
  <g id="day-0" class="day"><!-- Day 0 --><title>day 0</title><rect x="-50" y="-20" width="100" height="40"/><text x="0" y="5" class="label">day 0</text></g>
  <!-- Arrow down to day 1 -->
  <line x1="0" y1="20" x2="0" y2="-20" class="arrow"/>
  <!-- Day 1 -->
  <g id="day-1" class="day"><!-- Day 1 --><title>day 1</title><rect x="-50" y="-20" width="100" height="40"/><text x="0" y="5" class="label">day 1</text></g>
  <line x1="0" y1="20" x2="0" y2="-20" class="arrow"/>
  <!-- Day 2 -->
  <g id="day-2" class="day"><!-- Day 2 --><title>day 2</title><rect x="-50" y="-20" width="100" height="40"/><text x="0" y="5" class="label">day 2</text></g>
  <line x1="0" y1="20" x2="0" y2="-20" class="arrow"/>
  <!-- Day 3 -->
  <g id="day-3" class="day"><!-- Day 3 --><title>day 3</title><rect x="-50" y="-20" width="100" height="40"/><text x="0" y="5" class="label">day 3</text></g>
</g>
<!-- Minute keys branching from each day -->
<g transform="translate(200, 180)">
  <!-- From day 0 -->
  <g transform="translate(-100, 0)">
    <g id="minute-0-0" class="minute"><!-- minute 0 from day 0 --><title>minute 0 from day 0</title><rect x="-30" y="-15" width="60" height="30"/><text x="0" y="5" class="label">min0-d0</text></g>
    <line x1="0" y1="15" x2="-50" y2="0" class="arrow"/>
  </g>
  <!-- From day 1 -->
  <g transform="translate(0, 0)">
    <g id="minute-1-0" class="minute"><!-- minute 0 from day 1 --><title>minute 0 from day 1</title><rect x="-30" y="-15" width="60" height="30"/><text x="0" y="5" class="label">min0-d1</text></g>
    <line x1="0" y1="15" x="-50" y2="0" class="arrow"/>
  </g>
  <!-- From day 2 -->
  <g transform="translate(100, 0)">
    <g id="minute-2-0" class="minute"><!-- minute 0 from day 2 --><title>minute 0 from day 2</title><rect x="-30" y="-15" width="60" height="30"/><text x="0" y="5" class="label">min0-d2</text></g>
    <line x1="0" y1="15" x="50" y2="0" class="arrow"/>
  </g>
  <!-- From day 3 -->
  <g transform="translate(200, 0)">
    <g id="minute-3-0" class="minute"><!-- minute 0 from day 3 --><title>minute 0 from day 3</title><rect x="-30" y="-15" width="60" height="30"/><text x="0" y="5" class="label">min0-d3</text></g>
    <line x1="0" y1="15" x="50" y2="0" class="arrow"/>
  </g>
</g>
</g>
<!-- Mini-map legend -->
<g transform="translate(50, 300)">
  <rect x="0" y="0" width="140" height="80" fill="#f5f5f5" stroke="#b0b0b0"/>
  <text x="10" y="20" class="label">Key Hierarchy Diagram</text>
  <text x="10" y="40" class="label">root → day → minute</text>
  <line x1="10" y1="55" x2="20" y2="55" class="arrow"/><text x="25" y="57" class="label">root key (32 bytes)</text>
  <line x1="30" y1="55" x2="40" y2="55" class="arrow"/><text x="45" y="57" class="label">day keys (HMAC-SHA256)</text>
  <line x1="50" y1="55" x2="60" y2="55" class="arrow"/><text x="65" y="57" class="label">minute keys (hourly rotation)</text>
</text>
</g>
<!-- Title -->
<text x="350" y="30" text-anchor="middle" font-size="20" font-weight="bold">HIVEMIND v2 Key Hierarchy</text>
<text x="350" y="55" text-anchor="middle" font-size="12" fill="#666">root key → day keys (HMAC-SHA256, chain) → minute keys (hourly, 60 per day)</text>
