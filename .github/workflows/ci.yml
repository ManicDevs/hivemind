name: hivemind
on:
  push:
    branches: [main]
  pull_request:
  tags: ["v*"]

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)"
      - name: vet
        run: go vet ./...
      - name: tests
        run: go test ./... -count=1

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: tests with race detector
        run: go test ./... -race -count=1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [gates, race]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64, out: hivemind-linux-amd64}
          - {goos: linux, goarch: arm64, out: hivemind-linux-arm64}
          - {goos: linux, goarch: arm, goarm: "7", out: hivemind-linux-arm}
          - {goos: darwin, goarch: amd64, out: hivemind-darwin-amd64}
          - {goos: darwin, goarch: arm64, out: hivemind-darwin-arm64}
          - {goos: windows, goarch: amd64, out: hivemind-windows-amd64.exe}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: go build -o "dist/${{ matrix.out }}" ./cmd/hivemind
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: dist/${{ matrix.out }}
