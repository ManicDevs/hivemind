name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Run tests
        run: make test
      - name: Vet
        run: go vet ./...
      - name: Format check
        run: gofmt -l cmd/ internal/
      - name: Build release
        run: make build-release
